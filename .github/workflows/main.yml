
name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      LOGSTASH_URL: ${{ secrets.LOGSTASH_URL }}
      APP_NAME: my-python-app
      APP_ENV: ci
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run app
        run: python app.py

      - name: Send final status to ELK
        if: always()
        # Map the job status safely to an environment variable here:
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - << 'PYEOF'
          import os, json, urllib.request, datetime

          # Read the status from the OS environment instead of GitHub templates
          status = os.getenv("JOB_STATUS", "unknown")

          payload = {
              "timestamp":   datetime.datetime.utcnow().isoformat() + "Z",
              "level":       "INFO" if status == "success" else "ERROR",
              "message":     f"CI run {status}",
              "app":         "my-python-app",
              "environment": "ci",
              "conclusion":  status,
              "run_number":  int(os.getenv("GITHUB_RUN_NUMBER", 0)),
              "branch":      os.getenv("GITHUB_REF_NAME", ""),
              "actor":       os.getenv("GITHUB_ACTOR", ""),
              "repository":  os.getenv("GITHUB_REPOSITORY", ""),
          }
          
          url  = os.getenv("LOGSTASH_URL")
          if url:
              data = json.dumps(payload).encode()
              req  = urllib.request.Request(url, data=data, headers={"Content-Type":"application/json"})
              urllib.request.urlopen(req, timeout=5)
              print("Log sent to ELK ✓")
          else:
              print("LOGSTASH_URL not configured.")
          PYEOF
